# Isolated restore drill: no host ports, no source PGDATA volume, no demo seed.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - recovery_pgdata:/var/lib/postgresql/data
    networks: [recovery]
  migrate:
    image: postgres:16-alpine
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - ./backend/migrations:/migrations:ro
      - ./scripts/db_roles.sql:/setup/db_roles.sql:ro
      - ./scripts/migrate.sh:/setup/migrate.sh:ro
    command: ["/bin/sh", "/setup/migrate.sh"]
    networks: [recovery]
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TRUSTED_PROXY_CIDRS: 172.31.0.2/32
      STOCKPILOT_ENV: ${STOCKPILOT_ENV:-development}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [recovery]
  worker:
    build: ./backend
    command: ["python", "-m", "app.jobs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STOCKPILOT_ENV: ${STOCKPILOT_ENV:-development}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TRUSTED_PROXY_CIDRS: 172.31.0.2/32
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [recovery]
  web:
    build: ./frontend
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      recovery:
        ipv4_address: 172.31.0.2
volumes:
  recovery_pgdata:
networks:
  recovery:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
