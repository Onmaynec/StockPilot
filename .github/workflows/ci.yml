name: CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockpilot
          POSTGRES_PASSWORD: stockpilot_ci
          POSTGRES_DB: stockpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockpilot -d stockpilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://stockpilot:stockpilot_ci@localhost:5432/stockpilot
      JWT_SECRET: ci_only_not_for_production_0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check --select E4,E7,E9,F63,F7,F82 backend
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/001_init.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/002_sessions.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/003_inventory.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/004_rate_limits.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/005_catalog_search.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/006_live_balances.sql
      - run: DEMO_PASSWORD=ci_demo_password_123 PYTHONPATH=backend python -m app.seed
      - run: PYTHONPATH=backend pytest -q backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm install --no-audit --no-fund
      - run: cd frontend && npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Give the backup container the CI runner's unprivileged UID/GID
        run: |
          sed -i "/^BACKUP_UID=/d; /^BACKUP_GID=/d" .env
          printf 'BACKUP_UID=%s\nBACKUP_GID=%s\n' "$(id -u)" "$(id -g)" >> .env
      - run: docker compose config -q
      - run: docker compose --profile backup config -q
      - run: docker compose -f compose.recovery.yml config -q
      - run: sh -n scripts/backup_rotate.sh scripts/schedule_backups.sh scripts/recovery_drill.sh
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: docker compose exec -T api python -m app.security_check
      - run: curl --fail --silent http://localhost:8080/ > /dev/null
      - run: curl --fail --silent http://localhost:8080/health/ready
      - name: Seed representative inventory
        run: docker compose exec -T api python -m app.seed
      - name: Update catalog statistics after bulk demo seed
        run: |
          docker compose exec -T db sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "ANALYZE products;"'
      - name: Verify isolated PostgreSQL backup and restore
        run: STOCKPILOT_VERIFY_RESTORE=1 sh scripts/verify_restore.sh | tee restore-report.json
      - name: Create an atomic snapshot with SHA-256 sidecar
        run: |
          set -o pipefail
          mkdir -p backups
          docker compose run --rm backup /bin/sh /scripts/backup_rotate.sh | tee backup-report.json
          # Two jobs in quick succession must never overwrite the same filename.
          docker compose run --rm backup /bin/sh /scripts/backup_rotate.sh > backup-repeat-report.json
          test "$(find backups -maxdepth 1 -name 'stockpilot-*.dump' | wc -l)" -eq 2
          for archive in backups/stockpilot-*.dump; do
            (cd backups && sha256sum --check "$(basename "$archive").sha256")
          done
      - name: Reject a corrupted backup archive
        run: |
          archive="$(find backups -maxdepth 1 -name 'stockpilot-*.dump' | head -n1)"
          cp "$archive" backups/tampered.dump
          (cd backups && sha256sum tampered.dump > tampered.dump.sha256)
          printf 'corruption' >> backups/tampered.dump
          if (cd backups && sha256sum --check tampered.dump.sha256); then
            echo "Tampered dump was incorrectly accepted" >&2
            exit 1
          fi
          rm -f backups/tampered.dump backups/tampered.dump.sha256
      - name: Boot an isolated full stack from the archived PostgreSQL data
        run: |
          set -o pipefail
          archive="$(find backups -maxdepth 1 -name 'stockpilot-*.dump' | head -n1)"
          STOCKPILOT_RECOVERY_DRILL=1 STOCKPILOT_RECOVERY_ISOLATED=1 \
            sh scripts/recovery_drill.sh "$archive" | tee recovery-report.json
      - name: Measure 60 authenticated concurrent users
        run: |
          docker compose exec -T -e STOCKPILOT_PERF_ALLOW=1 api python -m app.load_profile > load-report.json
          cat load-report.json
      - name: Mixed API write rehearsal (20 competing orders, 40 ledger movements)
        run: |
          docker compose exec -T \
            -e STOCKPILOT_WRITE_PROFILE_ALLOW=1 \
            -e STOCKPILOT_WRITE_PROFILE_ISOLATED=1 \
            -e STOCKPILOT_WRITE_TRANSFERS=20 api python -m app.write_profile > write-report.json
          cat write-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stockpilot-07-disaster-recovery-evidence
          path: |
            restore-report.json
            load-report.json
            write-report.json
            backup-report.json
            backup-repeat-report.json
            recovery-report.json
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --tail=120 api db migrate worker web
      - if: always()
        run: docker compose down -v

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: cd frontend && npm install --no-audit --no-fund
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium firefox
      - name: Start isolated demo environment
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
          docker compose exec -T api python -m app.seed
      - name: Browser E2E - mobile Chromium and desktop Firefox
        run: cd frontend && npm run test:e2e
        env:
          CI: '1'
          DEMO_PASSWORD: DemoStock2026!
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=150 api db migrate worker web
      - name: Clean up test environment
        if: always()
        run: docker compose down -v
