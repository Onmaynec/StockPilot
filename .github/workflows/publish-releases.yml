name: Publish StockPilot releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check publishing permission
        env:
          RELEASE_TOKEN: ${{ secrets.STOCKPILOT_RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Set STOCKPILOT_RELEASE_TOKEN (Contents: write, Workflows: write) or follow docs/PUBLISH_RELEASES.md"
            exit 1
          fi
      - name: Check out release notes and tag targets
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.STOCKPILOT_RELEASE_TOKEN }}
      - name: Create immutable version tags
        run: |
          if ! git ls-remote --tags --exit-code origin refs/tags/v0.1.0 >/dev/null 2>&1; then
            git tag v0.1.0 5abd53f8c61439447bb8699740f3f7cbad21403e
            git push origin refs/tags/v0.1.0
          fi
          if ! git ls-remote --tags --exit-code origin refs/tags/v0.2.0 >/dev/null 2>&1; then
            git tag v0.2.0 1cc94c2fb0d7303f15f38998e012a4c0b302e2fa
            git push origin refs/tags/v0.2.0
          fi
          if ! git ls-remote --tags --exit-code origin refs/tags/v0.3.0 >/dev/null 2>&1; then
            git tag v0.3.0 1f7346e80a03fc8333fd1eee87e65013d5e56edc
            git push origin refs/tags/v0.3.0
          fi
          if ! git ls-remote --tags --exit-code origin refs/tags/v0.4.0 >/dev/null 2>&1; then
            git tag v0.4.0 d55ab40246622101f49f83725297d26208e19607
            git push origin refs/tags/v0.4.0
          fi
          if ! git ls-remote --tags --exit-code origin refs/tags/v0.5.0 >/dev/null 2>&1; then
            git tag v0.5.0 106e6fa224fb55b068c5d02ebf3636c63cf353f3
            git push origin refs/tags/v0.5.0
          fi
          if ! git ls-remote --tags --exit-code origin refs/tags/v0.6.0 >/dev/null 2>&1; then
            git tag v0.6.0 ed6530f11f34c3d2b70da082676abce04dbf5c04
            git push origin refs/tags/v0.6.0
          fi
          if ! git ls-remote --tags --exit-code origin refs/tags/v0.7.0 >/dev/null 2>&1; then
            git tag v0.7.0 637e1baa0c81135c4cfa8f977456d666f86c4d03
            git push origin refs/tags/v0.7.0
          fi
      - name: Publish v0.1.0 from its source commit
        env:
          GH_TOKEN: ${{ secrets.STOCKPILOT_RELEASE_TOKEN }}
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.1.0 already exists; leaving it unchanged"
          else
            gh release create v0.1.0 --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "StockPilot v0.1.0 — первый MVP" \
              --notes-file docs/RELEASE_0.1.0.md
          fi
      - name: Publish v0.2.0 from the verified merge commit
        env:
          GH_TOKEN: ${{ secrets.STOCKPILOT_RELEASE_TOKEN }}
        run: |
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.2.0 already exists; leaving it unchanged"
          else
            gh release create v0.2.0 --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "StockPilot v0.2.0 — Operations Update" \
              --notes-file docs/RELEASE_0.2.0.md \
              --latest
          fi
      - name: Publish v0.3.0 from verified code
        env:
          GH_TOKEN: ${{ secrets.STOCKPILOT_RELEASE_TOKEN }}
        run: |
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.3.0 already exists; leaving it unchanged"
          else
            gh release create v0.3.0 --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "StockPilot v0.3.0 — Inventory Accuracy & Reliability" \
              --notes-file docs/RELEASE_0.3.0.md \
              --latest
          fi
      - name: Publish v0.4.0 from verified code
        env:
          GH_TOKEN: ${{ secrets.STOCKPILOT_RELEASE_TOKEN }}
        run: |
          if gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.4.0 already exists; leaving it unchanged"
          else
            gh release create v0.4.0 --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "StockPilot v0.4.0 — Security & Operations" \
              --notes-file docs/RELEASE_0.4.0.md \
              --latest
          fi
      - name: Publish v0.5.0 from verified code
        env:
          GH_TOKEN: ${{ secrets.STOCKPILOT_RELEASE_TOKEN }}
        run: |
          if gh release view v0.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.5.0 already exists; leaving it unchanged"
          else
            gh release create v0.5.0 --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "StockPilot v0.5.0 — Warehouse Administration" \
              --notes-file docs/RELEASE_0.5.0.md \
              --latest
          fi
      - name: Publish v0.6.0 from verified code
        env:
          GH_TOKEN: ${{ secrets.STOCKPILOT_RELEASE_TOKEN }}
        run: |
          if gh release view v0.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.6.0 already exists; leaving it unchanged"
          else
            gh release create v0.6.0 --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "StockPilot v0.6.0 — Balance Performance & Write Validation" \
              --notes-file docs/RELEASE_0.6.0.md \
              --latest
          fi
      - name: Publish v0.7.0 from verified code
        env:
          GH_TOKEN: ${{ secrets.STOCKPILOT_RELEASE_TOKEN }}
        run: |
          if gh release view v0.7.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.7.0 already exists; leaving it unchanged"
          else
            gh release create v0.7.0 --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "StockPilot v0.7.0 — Backup & Recovery" \
              --notes-file docs/RELEASE_0.7.0.md \
              --latest
          fi
      - name: Verify seven public releases
        env:
          GH_TOKEN: ${{ secrets.STOCKPILOT_RELEASE_TOKEN }}
        run: |
          gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease
          gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease
          gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease
          gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease
          gh release view v0.5.0 --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease
          gh release view v0.6.0 --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease
          gh release view v0.7.0 --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease
