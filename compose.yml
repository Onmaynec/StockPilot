services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    networks: [private]
  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - ./backend/migrations:/migrations:ro
      - ./scripts/db_roles.sql:/setup/db_roles.sql:ro
      - ./scripts/migrate.sh:/setup/migrate.sh:ro
    command: ["/bin/sh", "/setup/migrate.sh"]
    networks: [private]
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      STOCKPILOT_ENV: ${STOCKPILOT_ENV:-development}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      retries: 8
    networks: [private]
  worker:
    build: ./backend
    command: ["python", "-m", "app.jobs"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STOCKPILOT_ENV: ${STOCKPILOT_ENV:-development}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [private]
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    # Backup files are private and owned by the host backup operator, not root.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      - ./scripts/backup_rotate.sh:/scripts/backup_rotate.sh:ro
      - ./scripts/schedule_backups.sh:/scripts/schedule_backups.sh:ro
    command: ["/bin/sh", "/scripts/schedule_backups.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -s /backups/.stockpilot-backup-status && grep -qx 'status=created' /backups/.stockpilot-backup-status && timestamp=$(sed -n 's/^timestamp=//p' /backups/.stockpilot-backup-status) && test -n \"$timestamp\" && test $(( $(date +%s) - timestamp )) -lt 93600"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m
    networks: [private]
  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy
    networks:
      private:
        ipv4_address: 172.29.250.2
volumes:
  pgdata:
networks:
  private:
    ipam:
      config:
        - subnet: 172.29.250.0/24
